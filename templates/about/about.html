{% extends 'base.html' %}
{% load static %}

{% block title %}درباره ما | مزون دیبا{% endblock %}

{% block content %}

<section class="page-header">
    <div class="container">
        <h1>درباره ما</h1>
    </div>
</section>

<section class="about-section">
    <div class="container">
        <div class="about-content">
            {% if about.image %}
            <img src="{{ about.image.url }}" alt="{{ about.title }}">
            {% endif %}
            <h2>{{ about.title }}</h2>
            <p>{{ about.content }}</p>
        </div>
    </div>
</section>

{% endblock %}
